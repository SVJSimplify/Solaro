# Deploys the Supabase Edge Functions whenever their code changes on main.
# Tests run first; if any fail, nothing is deployed and the live functions stay as they were.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-functions
  cancel-in-progress: false   # never cut a deploy off half-way

env:
  PROJECT_REF: wqhxpfzbvtkdwzehddjr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:tools
      - run: npm run test:schedule

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret"; exit 1; fi
          # Signed-in staff only: Supabase checks the login before the function runs.
          for fn in staff-agent llm-proxy assistant; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done
          # Public (website chat) and scheduled: these check their own token instead.
          for fn in widget-chat outbox-dispatch; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          done
