# Nightly off-site backup of the production database, with an automatic restore test.
#  1. Dump roles, schema and data from production (Supabase CLI).
#  2. Restore the dump into a throwaway local Supabase database and check every table came back with every row.
#  3. Encrypt with an age public key (only the holder of the private key can read it) and keep it for 30 days.
# A failed dump or restore fails the run, and GitHub emails the repository owner.
# Needs two repository secrets:
#   SUPABASE_DB_URL       Supabase → Connect → Session pooler connection string (with the database password)
#   BACKUP_AGE_RECIPIENT  the public key printed by `age-keygen` (starts with age1). Keep the private key offline.
name: Nightly database backup

on:
  schedule:
    - cron: '0 21 * * *'        # 02:30 India time
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      RESTORE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          [ -n "$DB_URL" ] || { echo "::error::Add the SUPABASE_DB_URL repository secret."; exit 1; }
          [[ "$RECIPIENT" == age1* ]] || { echo "::error::Add the BACKUP_AGE_RECIPIENT repository secret (an age public key, starts with age1)."; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump production
        run: |
          umask 077 && mkdir -p out
          supabase db dump --db-url "$DB_URL" -f out/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f out/schema.sql
          supabase db dump --db-url "$DB_URL" -f out/data.sql --use-copy --data-only
          ls -la out

      - name: Restore into a throwaway database
        run: |
          # Separate workdir, so the local database starts empty instead of replaying this repo's migrations.
          mkdir -p /tmp/restore/supabase
          printf 'project_id = "restore-test"\n[db]\nmajor_version = 17\n' > /tmp/restore/supabase/config.toml
          supabase db start --workdir /tmp/restore
          psql "$RESTORE_URL" --single-transaction -v ON_ERROR_STOP=1 -q \
            -f out/roles.sql -f out/schema.sql -c 'SET session_replication_role = replica' -f out/data.sql

      - name: Verify the restore
        run: python3 .github/scripts/verify_restore.py out/data.sql "$RESTORE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt
        run: |
          sudo apt-get install -y -qq age >/dev/null
          name="solara-db-$(date -u +%Y-%m-%d).tar.gz.age"
          tar -C out -czf - . | age -r "$RECIPIENT" -o "$name"
          rm -rf out
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"
          echo "Encrypted archive: \`$name\` ($(du -h "$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30
          if-no-files-found: error

      - name: Stop the throwaway database
        if: always()
        run: supabase stop --workdir /tmp/restore --no-backup || true
