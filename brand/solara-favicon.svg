<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Solara">
  <!-- Simplified Solara mark for 16–48px: coral tile, sun + horizon, three rays, pixel-snapped to a 16px grid. -->
  <rect width="64" height="64" rx="14" fill="#F25C54"/>
  <clipPath id="sky"><rect width="64" height="44"/></clipPath>
  <circle cx="32" cy="44" r="16" fill="#FFF6E5" clip-path="url(#sky)"/>
  <g stroke="#FFF6E5" stroke-width="5" stroke-linecap="round">
    <path d="M32 12v8M14 22l5 5M50 22l-5 5"/>
  </g>
  <rect x="10" y="46" width="44" height="4" rx="2" fill="#FFF6E5"/>
</svg>
